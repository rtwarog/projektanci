<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Countdown</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #000;
}

/* ---- FULLSCREEN TŁO 1920x1080 (16:9) ---- */
#bg-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
}

#bg-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    pointer-events: none;
}

/* ---- LICZNIK: 50% + LEWY GÓRNY RÓG ---- */
#countdown-wrapper {
    position: fixed;
    top: 20px;
    left: 20px;

    transform: scale(0.5);
    transform-origin: top left;
    transform-style: preserve-3d;

    z-index: 10;
}

#countdown-box {
    padding: 30px 40px;
    background: rgba(0, 0, 0, 0.65);
    border-radius: 14px;
    backdrop-filter: blur(3px);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    border: 2px solid rgba(255, 255, 255, 0.6);
    color: white;
}

h3 {
    margin-bottom: 25px;
    font-size: 30px;
    font-weight: 700;
    color: white;
    text-shadow: 0 0 10px rgba(0,0,0,1);
    text-align: center;
}

.cd-item {
    display: inline-block;
    background: rgba(0, 0, 0, 0.85);
    border-radius: 10px;
    padding: 20px 28px;
    margin: 6px;
    min-width: 120px;
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 0 16px rgba(255,255,255,0.4);
    transition: 0.25s ease;
}

.cd-item:hover {
    transform: scale(1.07);
    box-shadow: 0 0 26px rgba(255,255,255,0.7);
    border-color: red;
}

.cd-value {
    font-size: 48px;
    font-weight: 800;
    text-shadow: 0 0 10px rgba(0,0,0,1);
}

.cd-label {
    margin-top: 8px;
    font-size: 16px;
    opacity: 0.95;
}
</style>
</head>

<body>

<!-- FULLSCREEN BACKGROUND -->
<div id="bg-container">
    <img src="images/tlo.jpg" alt="tło">
</div>

<!-- LICZNIK -->
<div id="countdown-wrapper">
    <div id="countdown-box">
        <h3>Do wydarzenia pozostało:</h3>

        <div class="cd-item">
            <span class="cd-value"></span>
            <div class="cd-label">Dni</div>
        </div>

        <div class="cd-item">
            <span class="cd-value"></span>
            <div class="cd-label">Godz.</div>
        </div>

        <div class="cd-item">
            <span class="cd-value"></span>
            <div class="cd-label">Min.</div>
        </div>

        <div class="cd-item">
            <span class="cd-value"></span>
            <div class="cd-label">Sek.</div>
        </div>
    </div>
</div>

<!-- SKRYPT ODLICZANIA -->
<script>
setTimeout(function () {
    const targetDate = new Date(2027, 0, 28, 17, 0, 0).getTime();
    const values = document.querySelectorAll('.cd-value');

    function updateCountdown() {
        const now = Date.now();
        const diff = targetDate - now;

        if (diff <= 0) {
            values.forEach(v => v.textContent = '0');
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        values[0].textContent = days;
        values[1].textContent = hours;
        values[2].textContent = minutes;
        values[3].textContent = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
}, 300);
</script>

</body>
</html>
